<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="716" height="716" viewBox="0 0 716 716" fill="none">
  <title>Yuandao earbuds floating product animation</title>
  <defs>
    <radialGradient id="groundGlow" cx="0" cy="0" r="1" gradientTransform="translate(358 610) rotate(90) scale(42 190)">
      <stop offset="0" stop-color="#0B65D1" stop-opacity="0.28" />
      <stop offset="1" stop-color="#0B65D1" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <ellipse cx="358" cy="610" rx="184" ry="34" fill="url(#groundGlow)" filter="url(#softShadow)">
    <animate attributeName="opacity" values="0.42;0.18;0.42" dur="3.2s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="scale" values="1 1;0.84 0.84;1 1" dur="3.2s" repeatCount="indefinite" />
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="2.8s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="-2 358 358;2 358 358;-2 358 358" dur="4.2s" repeatCount="indefinite" additive="sum" />
    <image x="76" y="54" width="564" height="564" preserveAspectRatio="xMidYMid meet" href="yuandao-earbuds-model.png" xlink:href="yuandao-earbuds-model.png" />
  </g>
</svg>
